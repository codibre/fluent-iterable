name: Publish Libraries

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Exercise everything without publishing, committing or merging'
        type: boolean
        default: false
      version:
        description: 'Exact version for any package that releases (empty = conventional bump)'
        type: string
        default: ''

# Only the most recently merged change should publish. Runs are SERIALIZED —
# cancel-in-progress stays false so a run that already started publishing is
# never killed mid-flight — and every older run skips itself in `decide` once
# a newer commit lands on master. The newest run builds master's tip, so one
# release covers all the merged PRs with a single changelog.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - name: Check whether a newer commit landed on the branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ '${{ github.event_name }}' != 'push' ]; then
            echo 'Manual run — publishing whatever commit was dispatched.'
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ -n "$LATEST" ] && [ "$LATEST" != '${{ github.sha }}' ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded by ${LATEST:0:7} — the newest run publishes all merged changes in one release."
          else
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: decide
    if: needs.decide.outputs.superseded == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build
        run: pnpm run build
        env:
          HUSKY: 0

      - name: Install release-it
        run: npm install -g release-it@21.0.2 @release-it/conventional-changelog@12.0.0

      - name: Get OIDC Token
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -sSL --fail-with-body "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://registry.npmjs.org" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = 'null' ]; then
            echo '::error::Could not mint an OIDC token for npm provenance (see curl output above). Check Actions general permissions: "Can GitHub Actions mint an id-token".'
            exit 1
          fi
          echo "oidc-token=${OIDC_TOKEN}" >> $GITHUB_OUTPUT

      # crates.io trusted publishing (OIDC): one 30-minute token for the
      # loop below, consumed by the -rs bridges' release-it hooks
      # (scripts/cargo-publish.sh). One-time setup on crates.io (crate
      # Settings -> Trusted Publishing): owner codibre / repo
      # fluent-iterable / workflow publish.yaml, environment empty.
      # continue-on-error: harmless while no rs release is pending; a
      # pending one fails loudly inside the hook with a pointer.
      - name: crates.io OIDC exchange (trusted publishing)
        id: cargo-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish libraries sequentially
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.oidc-token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PUBLISHED=()
          SKIPPED=()
          FAILED=()

          # Get list of non-private packages in libs/
          PACKAGES=$(for lib in libs/*/; do
            if [ -f "${lib}package.json" ]; then
              name=$(node -p "require('./${lib}package.json').name")
              private=$(node -p "try{require('./${lib}package.json').private}catch(e){'undefined'}")
              if [ "$private" != "true" ] && [ -n "$name" ]; then
                echo "${name}|${lib}"
              fi
            fi
          done)

          echo "Packages to check:"
          echo "$PACKAGES" | while IFS='|' read -r name path; do echo "  - $name"; done

          configure_npmrc() {
            local token="$1"
            echo "//registry.npmjs.org/:_authToken=${token}" > ~/.npmrc
            echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
            echo "always-auth=true" >> ~/.npmrc
          }

          DRY_FLAG=''
          if [ "$DRY_RUN" = 'true' ]; then
            DRY_FLAG='--dry-run'
          fi

          VERSION_ARG=''
          if [ -n "$MANUAL_VERSION" ]; then
            VERSION_ARG="$MANUAL_VERSION"
          fi

          for entry in $PACKAGES; do
            IFS='|' read -r pkg_name lib_path <<< "$entry"
            pkg_dir=$(realpath "./${lib_path}")
            echo ""
            echo ">>> Checking ${pkg_name} from ${pkg_dir}"

            configure_npmrc "$OIDC_TOKEN"
            OLD_VERSION=$(node -p "require('${pkg_dir}/package.json').version")

            # master accepts changes through pull requests, so release-it must
            # NOT push: it bumps, writes CHANGELOG.md, runs the publish hook
            # (npm --provenance, or cargo for the rs bridge), then commits and
            # tags LOCALLY; commit+tag reach master through a release PR
            # below. The PR title carries [skip ci], so merging triggers no
            # further run. The old `|| true` + regex guess turned real publish
            # failures into a green "Successfully published" — failures now
            # fail the job.
            RC=0
            OUTPUT=$(cd "$pkg_dir" && release-it ${VERSION_ARG} --ci --git.push=false ${DRY_FLAG} 2>&1) || RC=$?
            echo "$OUTPUT"
            if [ "$RC" -ne 0 ]; then
              echo "::error::${pkg_name}: release-it failed (exit ${RC}). Nothing was merged; check the output above before re-running."
              FAILED+=("$pkg_name")
              continue
            fi

            NEW_VERSION=$(node -p "require('${pkg_dir}/package.json').version")
            if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
              SKIPPED+=("$pkg_name")
              continue
            fi

            if [ "$DRY_RUN" = 'true' ]; then
              echo "Dry run: would push release/${pkg_name}-v${NEW_VERSION} + tag ${pkg_name}@${NEW_VERSION} and merge its PR."
              PUBLISHED+=("$pkg_name ${NEW_VERSION} (dry run)")
              continue
            fi

            BRANCH="release/${pkg_name}-v${NEW_VERSION}"
            TAG="${pkg_name}@${NEW_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::${TAG} already exists on the remote but ${pkg_name} was bumped again — investigate before re-running."
              FAILED+=("$pkg_name")
              continue
            fi

            git push origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"

            PR_URL=$(gh pr create --base master --head "$BRANCH" \
              --title "chore(${pkg_name}): release v${NEW_VERSION} [skip ci]" \
              --body "Automated release from the publish workflow (run commit \`${GITHUB_SHA}\`). The version was published by this run; merging lands the version bump and changelog on master.")
            PR_NUM=${PR_URL##*/}
            gh pr merge "$PR_NUM" --merge
            PUBLISHED+=("$pkg_name ${NEW_VERSION}")
          done

          echo ""
          echo "=== Summary ==="
          if [ ${#PUBLISHED[@]} -gt 0 ]; then
            echo "Published:"
            for pkg in "${PUBLISHED[@]}"; do echo "  ✓ $pkg"; done
          fi
          if [ ${#SKIPPED[@]} -gt 0 ]; then
            echo "Skipped (no new commits):"
            for pkg in "${SKIPPED[@]}"; do echo "  ⏭️  $pkg"; done
          fi
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "FAILED:"
            for pkg in "${FAILED[@]}"; do echo "  ✖ $pkg"; done
            exit 1
          fi
          if [ ${#PUBLISHED[@]} -eq 0 ] && [ ${#SKIPPED[@]} -gt 0 ]; then
            echo "No libraries needed publishing this run."
          elif [ ${#PUBLISHED[@]} -gt 0 ]; then
            echo "Successfully published ${#PUBLISHED[@]} library(ies)."
          fi

      # Rust crate note (historical): the manifest is no longer the release
      # trigger. Every -rs bridge is release-it-driven like the TS
      # siblings — conventional commits touching its directory bump it, and
      # the after:bump hook (shared root scripts/cargo-publish.sh) syncs
      # Cargo.toml and publishes the crate to crates.io with the OIDC token
      # above.
