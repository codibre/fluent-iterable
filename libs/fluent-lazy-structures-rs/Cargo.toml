[package]
name = "fluent-lazy-structures"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "On-demand, concurrently populated lookup structures (LazyMap) for futures Streams: the Rust sibling of @fluent-iterable/lazy-structures"
repository = "https://github.com/codibre/fluent-iterable"
keywords = ["stream", "lazy", "map", "tokio", "futures"]
categories = ["asynchronous", "data-structures"]
authors = ["Thiago O Santos <tos.oliveira@gmail.com>"]
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
dashmap = "6"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
